spring:
  application:
    name: backend-realisasi
  profiles:
    default: prod
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Jakarta
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8040

app:
  timezone: Asia/Jakarta
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
