# Development: H2 in-memory + data contoh (DevDataSeeder)
spring:
  datasource:
    url: jdbc:h2:mem:realisasi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
# Tanpa AD: semua username diterima dengan password "dev" (set LDAP_ENABLED=true untuk mencoba AD asli).
ldap:
  enabled: ${LDAP_ENABLED:false}
app:
  auth:
    required: ${AUTH_REQUIRED:false}
    # Login dev "admin" (password dev) bebas memilih divisi.
    admin-users: ${SATRIA_ADMIN_USERS:admin}
